[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meal-organizer"
version = "0.1.0"
description = "A local-first CLI meal planner for students."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PASTY667"}]
dependencies = [
  "typer>=0.16,<1",
  "rich>=14,<15",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
meal-organizer = "meal_organizer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meal_organizer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
